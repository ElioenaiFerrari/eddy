[package]
name = "eddy"
version = "0.1.0"
edition = "2021"

[dependencies]
bevy = "0.14.0"
bevy_kira_audio = { version = "0.20.0", features = ["ogg", "wav"] }
env_logger = "0.11.5"
log = { version = "0.4.22", features = ["serde"] }


[target.'cfg(windows)'.dependencies]
winapi = "0.3.9"

[target.'cfg(target_arch = "wasm32")'.dependencies]
wasm-bindgen = "0.2.92"

[lib]
crate-type = ["cdylib", "rlib"]
